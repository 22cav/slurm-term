name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Refuse to publish a tag whose version disagrees with the manifests, or
  # that has no changelog entry — both are silent-wrong-release failure modes.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifests and changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PY_VERSION=$(sed -n '/^\[project\]/,/^\[/s/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)

          echo "tag=$VERSION cargo=$CARGO_VERSION pyproject=$PY_VERSION"
          [ "$VERSION" = "$CARGO_VERSION" ] || { echo "::error::tag $VERSION != Cargo.toml $CARGO_VERSION"; exit 1; }
          [ "$VERSION" = "$PY_VERSION" ]    || { echo "::error::tag $VERSION != pyproject.toml $PY_VERSION"; exit 1; }
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::no CHANGELOG.md entry for $VERSION"; exit 1; }

  # Same clippy/test/build gate as every push — a red build must not ship.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-wheels:
    needs: [verify, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock is committed and in sync with the version bump, so the
      # working tree stays clean during the verify build — no --allow-dirty.
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [build-wheels, publish-pypi, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ESC_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')
          {
            echo "notes<<EOF"
            awk "/^## \[${ESC_VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body: ${{ steps.changelog.outputs.notes }}
